# Terminal tab titles for tmux, loaded from ~/.tmux.conf by install.sh.
#
# A Claude Code tab reads "<project>-<worktree number> <topic>": "Quill-6",
# "Turva-2" or "Juttu-3", and the main checkout the bare name, "Quill",
# "Turva" or "Juttu". Owl's tab reads "Owl". The topic is the session's
# @topic option, kept by claude/hooks/tab-topic.sh. Until it is set, Claude
# Code's own pane title stands in, minus its status symbol, and an idle
# "Claude Code" shows as the label alone.
#
# The sessions are the ones `just cc` makes: q1 to q99 for Quill Medical,
# where q1 is the main checkout, turva and turva-<n>, juttu and juttu-<n>,
# and owl. Plain shells keep their own names: "Tmux turva-1-2" for a
# tmux-turva-1-2 session, "Tmux T3" for a t3, "Tmux Owl" for towl.

%hidden CLAUDE_SESSION="#{m/r:^(q[0-9]+|(turva|juttu)(-[0-9]+)?|owl)$,#{session_name}}"
%hidden LABEL="#{?#{==:#{session_name},q1},Quill,#{?#{m/r:^q[0-9]+$,#{session_name}},#{s/^q/Quill-/:session_name},#{?#{m/r:^turva,#{session_name}},#{s/^turva/Turva/:session_name},#{?#{m/r:^juttu,#{session_name}},#{s/^juttu/Juttu/:session_name},Owl}}}}"
%hidden TOPIC="#{?#{@topic}, #{@topic},#{?#{m:*Claude Code,#{pane_title}},, #{s/^[^ ]* //:pane_title}}}"
%hidden SHELL_TITLE="#{?#{m:tmux-*,#{session_name}},Tmux #{s/^tmux-//:session_name},#{?#{==:#{session_name},towl},Tmux Owl,#{?#{m:t-*,#{session_name}},Tmux #{s/^t-//:session_name},#{?#{m/r:^t[0-9]+$,#{session_name}},Tmux #{s/^t/T/:session_name},#{session_name}}}}}"

set -g set-titles on
set -g set-titles-string "#{?${CLAUDE_SESSION},${LABEL}${TOPIC},${SHELL_TITLE}}"
