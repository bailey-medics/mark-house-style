# Terminal tab titles for tmux, loaded from ~/.tmux.conf by install.sh.
#
# A Claude Code tab reads "<project>-<worktree number> <topic>": "Quill-6",
# "Turva-2" or "Juttu-3", and the main checkout the bare name, "Quill",
# "Turva" or "Juttu". Owl's tab reads "Owl", Arnie's "Arnie", Digest's
# "Digest" and Kaiku's "Kaiku". The topic is the session's
# @topic option, kept by claude/hooks/tab-topic.sh. Until it is set, a
# Quill, Turva or Juttu tab shows "---" in its place. Owl, Arnie, Digest
# and Kaiku never get a topic from the hook, so Claude Code's own pane title stands
# in for theirs, minus its status symbol, and an idle "Claude Code" shows
# as the label alone.
#
# The sessions are the ones `just cc` makes: q1 to q99 for Quill Medical,
# where q1 is the main checkout, turva and turva-<n>, juttu and juttu-<n>,
# owl, arnie, digest and kaiku.
#
# A plain shell's tab reads the same label, then "Tmux", and the shell's
# number when it is not the checkout's first. The sessions are the ones
# `just tw` makes, named as the title reads: "Quill-6 Tmux" for
# quill-6-tmux, "Quill-6 Tmux-2" for quill-6-tmux-2, "Turva Tmux-2" for
# turva-tmux-2 and "Owl Tmux" for owl-tmux. So the title is the name with
# a capital on the project and a space before "Tmux". Any other session
# shows its own name.

%hidden CLAUDE_SESSION="#{m/r:^(q[0-9]+|(turva|juttu)(-[0-9]+)?|owl|arnie|digest|kaiku)$,#{session_name}}"
%hidden LABEL="#{?#{==:#{session_name},q1},Quill,#{?#{m/r:^q[0-9]+$,#{session_name}},#{s/^q/Quill-/:session_name},#{?#{m/r:^turva,#{session_name}},#{s/^turva/Turva/:session_name},#{?#{m/r:^juttu,#{session_name}},#{s/^juttu/Juttu/:session_name},#{?#{==:#{session_name},arnie},Arnie,#{?#{==:#{session_name},digest},Digest,#{?#{==:#{session_name},kaiku},Kaiku,Owl}}}}}}}"
%hidden NAMED_BY_HOOK="#{m/r:^(q[0-9]+|(turva|juttu)(-[0-9]+)?)$,#{session_name}}"
%hidden TOPIC="#{?#{@topic}, #{@topic},#{?${NAMED_BY_HOOK}, ---,#{?#{m:*Claude Code,#{pane_title}},, #{s/^[^ ]* //:pane_title}}}}"
%hidden SHELL_SESSION="#{m/r:^((quill|turva|juttu)(-[0-9]+)?|owl|arnie|digest|kaiku)-tmux(-[0-9]+)?$,#{session_name}}"
%hidden SHELL_TITLE="#{s/^quill/Quill/;s/^turva/Turva/;s/^juttu/Juttu/;s/^owl/Owl/;s/^arnie/Arnie/;s/^digest/Digest/;s/^kaiku/Kaiku/;s/-tmux/ Tmux/:session_name}"

set -g set-titles on
set -g set-titles-string "#{?${CLAUDE_SESSION},${LABEL}${TOPIC},#{?${SHELL_SESSION},${SHELL_TITLE},#{session_name}}}"
